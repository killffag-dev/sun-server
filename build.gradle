plugins {
    id 'fabric-loom' version '1.12.7'
    id 'maven-publish'
}

group = 'naryn.sun'
version = "1.0.0+mc${project.minecraft_version}"

base {
    archivesName = "sun-${project.minecraft_version}"
}

// Stonecutter evaluates this script from a version child project. Keep the
// established source tree shared until a confirmed incompatibility needs a
// version-gated branch in the source.
sourceSets {
    main {
        // `setSrcDirs`, rather than `srcDirs`, replaces Stonecutter's default
        // version-local directories and prevents every resource being copied twice.
        java.setSrcDirs([rootProject.file('src/main/java')])
        resources.setSrcDirs([rootProject.file('src/main/resources')])
    }
}

processResources {
    inputs.property 'minecraft_version', project.minecraft_version

    filesMatching('fabric.mod.json') {
        expand minecraft_version: project.minecraft_version
    }

    // ╨д╨░╨╖╨░ 4: .otf тАФ ╨в╨Ю╨Ы╨м╨Ъ╨Ю ╨╕╤Б╤Е╨╛╨┤╨╜╨╕╨║╨╕ ╨┤╨╗╤П ╨╛╤Д╨╗╨░╨╣╨╜-╨│╨╡╨╜╨╡╤А╨░╤Ж╨╕╨╕ MSDF-╨░╤В╨╗╨░╤Б╨╛╨▓,
    // ╨▓ ╤А╨░╨╜╤В╨░╨╣╨╝╨╡ ╨╛╨╜╨╕ ╨╜╨╡ ╤З╨╕╤В╨░╤О╤В╤Б╤П ╨╜╨╕ ╨╛╨┤╨╜╨╕╨╝ ╨║╨╗╨░╤Б╤Б╨╛╨╝. ╨Р╤В╨╗╨░╤Б╤Л (fonts/msdf/*.png|json)
    // ╨╛╤Б╤В╨░╤О╤В╤Б╤П. ╨н╨║╨╛╨╜╨╛╨╝╨╕╤П ~1.6 ╨Ь╨С ╨▓ jar (╤Д╨░╨╣╨╗╤Л ╨╜╨░ ╨┤╨╕╤Б╨║╨╡ ╨╜╨╡ ╤В╤А╨╛╨│╨░╤О╤В╤Б╤П).
    exclude 'assets/sun/fonts/*.otf'
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
    maven { url 'https://jitpack.io' }
    maven { url = 'https://api.modrinth.com/maven' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.minecraft_version}+build.8:v2"

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    modImplementation "maven.modrinth:sodium:${project.sodium_version}"

    compileOnly "io.github.llamalad7:mixinextras-fabric:${project.mixinextras_version}"
    annotationProcessor "io.github.llamalad7:mixinextras-fabric:${project.mixinextras_version}"

    compileOnly "org.projectlombok:lombok:1.18.32"
    annotationProcessor "org.projectlombok:lombok:1.18.32"

    compileOnly "javax.annotation:javax.annotation-api:1.3.2"

    // ╨д╨░╨╖╨░ 7: jsr305 ╨╛╤Б╤В╨░╨▓╨╗╨╡╨╜ тАФ ╨╕╤Б╨┐╨╛╨╗╤М╨╖╤Г╨╡╤В╤Б╤П (javax.annotation.Nonnull ╨▓ Localizator).
    // compileOnly, ╨▓ jar ╨╜╨╡ ╨┐╨╛╨┐╨░╨┤╨░╨╡╤В (~20 KB, ╨╜╨╛╨╗╤М ╤А╨░╨╜╤В╨░╨╣╨╝-╨▓╨╡╤Б╨░).
    compileOnly "com.google.code.findbugs:jsr305:3.0.2"
}

loom {
    accessWidenerPath = rootProject.file('src/main/resources/sun.accesswidener')

    runs {
        client {
            // All version targets deliberately share the established development
            // profile, so worlds and both Minecraft/Sun settings stay in /run.
            // Loom resolves this setting relative to the Stonecutter child
            // project (versions/1.21.4), so it must stay relative here.
            runDir = '../../run'
            programArgs '--username', 'sddharddisk'
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
