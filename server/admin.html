<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUN Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: '#0f111a',
                        card: '#1a1d2d',
                        primary: '#3b82f6',
                        accent: '#8b5cf6'
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0f111a; color: #e2e8f0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .glass-modal { background: rgba(26, 29, 45, 0.95); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="min-h-screen bg-dark text-gray-200">

    <!-- Auth Modal -->
    <div id="authModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-70 glass-modal">
        <div class="bg-card p-8 rounded-xl shadow-2xl w-96 border border-gray-700">
            <h2 class="text-2xl font-bold mb-6 text-center bg-clip-text text-transparent bg-gradient-to-r from-primary to-accent">SUN Admin Login</h2>
            <form onsubmit="event.preventDefault(); loginAdmin(); return false;">
                <input type="password" id="authPassword" placeholder="Пароль администратора" class="w-full p-3 rounded bg-dark border border-gray-600 focus:outline-none focus:border-primary mb-4 text-center" autofocus required>
                <button type="submit" class="w-full bg-gradient-to-r from-primary to-accent hover:from-blue-600 hover:to-purple-600 text-white font-bold py-3 rounded transition-all">Войти</button>
                <p id="authError" class="text-red-400 text-sm mt-3 text-center leading-relaxed" style="display: none;"></p>
            </form>
        </div>
    </div>

    <!-- Announcement Modal -->
    <div id="announceModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-70 glass-modal" style="display:none;">
        <div class="bg-card p-8 rounded-xl shadow-2xl w-96 border border-gray-700">
            <h2 class="text-xl font-bold mb-4">Send Announcement</h2>
            <p class="text-xs text-gray-400 mb-2">Users will see this upon next login.</p>
            <div class="mb-4">
                <label class="flex items-center space-x-2 text-sm text-gray-300">
                    <input type="checkbox" id="announceIsUpdate" class="rounded bg-dark border-gray-600" onchange="document.getElementById('versionInputDiv').style.display = this.checked ? 'block' : 'none'">
                    <span>This is a Mandatory Update</span>
                </label>
            </div>
            <div id="versionInputDiv" class="mb-4" style="display:none;">
                <input type="text" id="announceVersion" placeholder="Target Version (e.g. 2.1.0)" class="w-full p-2 rounded bg-dark border border-gray-600 focus:border-primary text-sm">
            </div>
            <textarea id="announceText" placeholder="Enter announcement text..." class="w-full p-3 rounded bg-dark border border-gray-600 focus:outline-none focus:border-primary mb-4 h-32"></textarea>
            <div class="flex gap-2">
                <button onclick="document.getElementById('announceModal').style.display='none'" class="w-1/2 bg-gray-600 hover:bg-gray-500 py-2 rounded">Cancel</button>
                <button onclick="submitAnnouncement()" class="w-1/2 bg-purple-600 hover:bg-purple-500 py-2 rounded font-bold">Send</button>
            </div>
        </div>
    </div>

    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside class="w-64 bg-card border-r border-gray-800 flex flex-col">
            <div class="p-6 flex items-center gap-3 border-b border-gray-800">
                <i class="fa-solid fa-sun text-accent text-2xl"></i>
                <span class="text-xl font-bold tracking-wider">SUN ADMIN</span>
            </div>
            <nav class="flex-1 p-4 space-y-2">
                <a href="#" onclick="currentView='active'; renderTable();" class="flex items-center gap-3 px-4 py-3 bg-dark/50 text-primary rounded-lg border border-primary/20">
                    <i class="fa-solid fa-users"></i>
                    <span>Users</span>
                </a>
                <a href="#" onclick="currentView='deleted'; renderTable();" class="flex items-center gap-3 px-4 py-3 bg-dark/50 text-red-400 rounded-lg border border-red-500/20 mt-2">
                    <i class="fa-solid fa-trash-can"></i>
                    <span>Recycle Bin (30d)</span>
                </a>
            </nav>
            <div class="p-4 border-t border-gray-800">
                <button onclick="logoutAdmin()" class="w-full flex items-center justify-center gap-2 px-4 py-2 text-gray-400 hover:text-white hover:bg-gray-800 rounded transition">
                    <i class="fa-solid fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 overflow-y-auto p-8">
            <header class="flex justify-between items-center mb-8">
                <div>
                    <h1 class="text-3xl font-bold" id="pageTitle">Управление Пользователями</h1>
                    <div class="flex items-center space-x-2 mt-3 bg-dark/50 p-1 rounded-lg border border-gray-700 w-fit">
                        <button id="btnViewMode" onclick="setEditorMode(false)" class="px-4 py-2 rounded-md bg-primary text-white text-sm font-bold shadow transition">Режим просмотра</button>
                        <button id="btnEditMode" onclick="setEditorMode(true)" class="px-4 py-2 rounded-md text-gray-400 hover:text-white text-sm transition">Режим редактора</button>
                    </div>
                </div>
                <div class="flex gap-4">
                    <button onclick="openGlobalAnnounceModal(false)" class="bg-purple-600 hover:bg-purple-500 text-white px-4 py-3 rounded-lg font-bold transition flex items-center gap-2 border border-purple-500">
                        <i class="fa-solid fa-bullhorn"></i> Объявление "Привет"
                    </button>
                    <button onclick="openGlobalAnnounceModal(true)" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-3 rounded-lg font-bold transition flex items-center gap-2 border border-blue-500">
                        <i class="fa-solid fa-code-branch"></i> О новой версии
                    </button>
                    <div class="bg-card px-6 py-3 rounded-lg border border-gray-800 flex items-center gap-4 ml-4">
                        <i class="fa-solid fa-gamepad text-green-500 text-xl"></i>
                        <div>
                            <p class="text-xs text-gray-400 uppercase tracking-wider">В Игре</p>
                            <p class="text-xl font-bold" id="stat-game">0</p>
                        </div>
                    </div>
                    <div class="bg-card px-6 py-3 rounded-lg border border-gray-800 flex items-center gap-4">
                        <i class="fa-solid fa-globe text-blue-500 text-xl"></i>
                        <div>
                            <p class="text-xs text-gray-400 uppercase tracking-wider">На Сайте</p>
                            <p class="text-xl font-bold" id="stat-web">0</p>
                        </div>
                    </div>
                    <div class="bg-card px-6 py-3 rounded-lg border border-gray-800 flex items-center gap-4">
                        <i class="fa-solid fa-user-check text-gray-400 text-xl"></i>
                        <div>
                            <p class="text-xs text-gray-400 uppercase tracking-wider">Всего</p>
                            <p class="text-xl font-bold" id="stat-total">0</p>
                        </div>
                    </div>
                </div>
            </header>

            <!-- Actions Bar -->
            <div class="flex justify-between items-center bg-card p-4 rounded-lg border border-gray-800 mb-6">
                <div class="flex gap-3 w-1/2">
                    <div class="relative w-full">
                        <i class="fa-solid fa-search absolute left-3 top-3 text-gray-500"></i>
                        <input type="text" id="searchInput" oninput="renderTable()" placeholder="Search users..." class="w-full pl-10 pr-4 py-2 rounded bg-dark border border-gray-700 focus:outline-none focus:border-primary">
                    </div>
                </div>
                <div class="flex gap-3">
                    <input type="text" id="newUsername" placeholder="Username" class="px-4 py-2 rounded bg-dark border border-gray-700 focus:outline-none focus:border-primary">
                    <button onclick="createUser()" class="bg-primary hover:bg-blue-600 text-white px-4 py-2 rounded font-medium transition flex items-center gap-2">
                        <i class="fa-solid fa-plus"></i> Add User
                    </button>
                </div>
            </div>

            <!-- Bulk Actions -->
            <div class="flex justify-between items-center bg-blue-900/20 p-3 rounded-lg border border-blue-500/30 mb-4 transition-all" id="bulkActions" style="display:none;">
                <div class="text-sm font-medium pl-2"><span id="selectedCount">0</span> selected</div>
                <div class="flex gap-2">
                    <button onclick="openAnnounceModal()" class="bg-purple-600 hover:bg-purple-500 px-3 py-1.5 text-sm rounded transition"><i class="fa-solid fa-bullhorn mr-1"></i> Announce</button>
                    <button onclick="promptBulkSparks()" class="bg-yellow-600 hover:bg-yellow-500 px-3 py-1.5 text-sm rounded transition"><i class="fa-solid fa-bolt mr-1"></i> +/- Sparks</button>
                    <button onclick="bulkDelete()" class="bg-red-600 hover:bg-red-500 px-3 py-1.5 text-sm rounded transition"><i class="fa-solid fa-trash mr-1"></i> Soft Delete</button>
                </div>
            </div>

            <!-- Table -->
            <div class="bg-card rounded-lg border border-gray-800 overflow-hidden">
                <table class="w-full text-left">
                    <thead class="bg-dark/50 border-b border-gray-800">
                        <tr>
                            <th class="p-4 w-12"><input type="checkbox" id="selectAll" onclick="toggleAll(this)"></th>
                            <th class="p-4 text-gray-400 font-medium">Статус / Пользователь</th>
                            <th class="p-4 text-gray-400 font-medium">Спарксы</th>
                            <th class="p-4 text-gray-400 font-medium text-right">Действия</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody" class="divide-y divide-gray-800/50">
                        <!-- Rows -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script>
        let allUsers = {};
        let currentView = 'active';

        let isEditorMode = false;
        function setEditorMode(mode) {
            isEditorMode = mode;
            document.getElementById('btnViewMode').className = mode ? "px-4 py-2 rounded-md text-gray-400 hover:text-white text-sm transition" : "px-4 py-2 rounded-md bg-primary text-white text-sm font-bold shadow transition";
            document.getElementById('btnEditMode').className = !mode ? "px-4 py-2 rounded-md text-gray-400 hover:text-white text-sm transition" : "px-4 py-2 rounded-md bg-primary text-white text-sm font-bold shadow transition";
            
            // Скрываем/показываем создание пользователей и действия
            const actionsBar = document.querySelector('.bg-card.p-4.rounded-lg.mb-6');
            if (actionsBar) {
                const addDiv = actionsBar.querySelector('.flex.gap-3:not(.w-1\/2)');
                if (addDiv) addDiv.style.display = mode ? 'flex' : 'none';
            }
            
            const thCheck = document.querySelector('th input#selectAll');
            if(thCheck) thCheck.style.display = mode ? 'block' : 'none';
            
            renderTable();
        }
     // 'active' or 'deleted'
        
        function getAuthToken() { return localStorage.getItem('sun_admin_token'); }
        
        async function checkAuth() {
            if(!getAuthToken()) {
                document.getElementById('authModal').style.display = 'flex';
                return;
            }
            await fetchUsers();
        }

        async function loginAdmin() {
            const pwd = (document.getElementById('authPassword').value || '').trim();
            const err = document.getElementById('authError');
            err.style.display = 'none';

            if (!pwd) {
                err.textContent = 'Пожалуйста, введите пароль администратора.';
                err.style.display = 'block';
                return;
            }

            if (/^\d{3}[-\s]?\d{3}$/.test(pwd)) {
                err.textContent = 'Вы ввели 6-значный код привязки игры. Этот код вводится в Личном кабинете (profile.html), а для админки нужен пароль (по умолчанию: sun2026admin).';
                err.style.display = 'block';
                return;
            }

            if (/^SUN-[A-Z0-9]{4}-[A-Z0-9]{4}$/i.test(pwd)) {
                err.textContent = 'Вы ввели ключ SUN ID. Для входа в админ-панель требуется пароль администратора (по умолчанию: sun2026admin).';
                err.style.display = 'block';
                return;
            }

            try {
                const res = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ password: pwd })
                });
                const data = await res.json();
                if(data.success) {
                    localStorage.setItem('sun_admin_token', data.token);
                    document.getElementById('authModal').style.display = 'none';
                    fetchUsers();
                } else {
                    err.textContent = (data.error || 'Неверный пароль') + ' (по умолчанию: sun2026admin)';
                    err.style.display = 'block';
                }
            } catch(e) {
                err.textContent = 'Ошибка сервера: ' + e.message;
                err.style.display = 'block';
            }
        }

        async function logoutAdmin() {
            try { await fetch('/api/admin/logout', { method: 'POST' }); } catch(e) {}
            localStorage.removeItem('sun_admin_token');
            document.getElementById('authModal').style.display = 'flex';
            document.getElementById('authPassword').value = '';
            allUsers = {};
            renderTable();
        }

        async function fetchUsers() {
            try {
                const res = await fetch('/api/admin/users', {
                    headers: getAuthToken() ? {'X-Admin-Token': getAuthToken()} : {}
                });
                if(res.status === 401) { logoutAdmin(); return; }
                allUsers = await res.json();
                renderTable();
            } catch(e) { console.error(e); }
        }

        async function sendAction(data) {
            try {
                const res = await fetch('/api/admin/action', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        ...(getAuthToken() ? {'X-Admin-Token': getAuthToken()} : {})
                    },
                    body: JSON.stringify(data)
                });
                if(res.status === 401) logoutAdmin();
                else fetchUsers();
            } catch(e) { console.error(e); }
        }

        function getSelectedIds() {
            return Array.from(document.querySelectorAll('.user-cb:checked')).map(cb => cb.value);
        }

        function updateSelection() {
            const selected = getSelectedIds().length;
            const bulkBar = document.getElementById('bulkActions');
            if (selected > 0) {
                bulkBar.style.display = 'flex';
                document.getElementById('selectedCount').innerText = selected;
            } else {
                bulkBar.style.display = 'none';
            }
        }

        function toggleAll(src) {
            const cbs = document.querySelectorAll('.user-cb');
            cbs.forEach(cb => cb.checked = src.checked);
            updateSelection();
        }

        function openAnnounceModal() {
            document.getElementById('announceText').value = '';
            document.getElementById('announceModal').style.display = 'flex';
        }

        function submitAnnouncement() {
            const text = document.getElementById('announceText').value;
            const isUpdate = document.getElementById('announceIsUpdate').checked;
            const version = document.getElementById('announceVersion').value;
            if (!text) return;
            const targets = getSelectedIds();
            if (targets.length === 0) return alert('No users selected');
            
            sendAction({ action: 'send_announcement', hwids: targets, text, isUpdate, version });
            document.getElementById('announceModal').style.display = 'none';
            document.querySelectorAll('.user-cb').forEach(cb => cb.checked = false);
            updateSelection();
        }

        function promptBulkSparks() {
            const hwids = getSelectedIds();
            if (hwids.length === 0) return;
            const amount = prompt("Enter sparks amount to add (e.g. 50) or remove (e.g. -30):");
            if (amount && !isNaN(parseInt(amount))) {
                sendAction({ action: 'add_coins_bulk', hwids: hwids, amount: parseInt(amount) });
            }
        }

        function bulkDelete() {
            const hwids = getSelectedIds();
            if (hwids.length === 0) return;
            if (confirm("Are you sure you want to soft-delete these " + hwids.length + " users? (They will be moved to the Recycle Bin for 30 days)")) {
                sendAction({ action: 'soft_delete_bulk', hwids: hwids });
                document.getElementById('selectAll').checked = false;
            }
        }

        function promptSparksSingle(hwid) {
            const amount = prompt("Enter sparks amount to add/remove (e.g. +50, -30):");
            if (amount && !isNaN(parseInt(amount))) {
                sendAction({ action: 'add_coins', hwid: hwid, amount: parseInt(amount) });
            }
        }

        function renderTable() {
            const tbody = document.getElementById('usersTableBody');
            const search = document.getElementById('searchInput').value.toLowerCase();
            document.getElementById('pageTitle').innerText = currentView === 'active' ? 'Управление Пользователями' : 'Корзина';
            
            tbody.innerHTML = '';
            document.getElementById('selectAll').checked = false;
            updateSelection();
            
            let total = 0;
            let gameOnlineCount = 0;
            let webOnlineCount = 0;

            for (const [key, user] of Object.entries(allUsers)) {
                if (search && !(user.username||'').toLowerCase().includes(search) && !key.toLowerCase().includes(search)) continue;
                
                const isDeleted = !!user.deletedAt;
                if (currentView === 'active' && isDeleted) continue;
                if (currentView === 'deleted' && !isDeleted) continue;

                total++;
                
                let gameOnline = user.lastGamePing && (Date.now() - user.lastGamePing) < 5 * 60 * 1000;
                let webOnline = user.lastWebPing && (Date.now() - user.lastWebPing) < 5 * 60 * 1000;
                if (gameOnline) gameOnlineCount++;
                if (webOnline) webOnlineCount++;

                const tr = document.createElement('tr');
                tr.className = "hover:bg-dark/30 transition border-b border-gray-800/50";
                
                const cosmeticsHtml = (Array.isArray(user.cosmetics) && user.cosmetics.length > 0) ? user.cosmetics.map(c => 
                    `<span class="px-2 py-1 bg-accent/20 text-accent text-xs rounded border border-accent/30 mr-1">${c}</span>`
                ).join('') : '<span class="text-gray-500 text-sm">Пусто</span>';

                const singleActions = !isEditorMode ? `<span class="text-xs text-gray-500">Только чтение</span>` : (isDeleted ? `
                    <button onclick="sendAction({action:'restore', hwid:'${key}'})" class="px-3 py-1 bg-green-500/20 text-green-400 hover:bg-green-500/30 rounded border border-green-500/30 transition" title="Restore User">
                        <i class="fa-solid fa-trash-arrow-up"></i>
                    </button>
                    <button onclick="if(confirm('Permanent delete?')) sendAction({action:'hard_delete', hwid:'${key}'})" class="px-3 py-1 bg-red-500/20 text-red-400 hover:bg-red-500/30 rounded border border-red-500/30 transition" title="Permanent Delete">
                        <i class="fa-solid fa-ban"></i>
                    </button>
                ` : `
                    <button onclick="promptSparksSingle('${key}')" class="px-3 py-1 bg-yellow-500/20 text-yellow-500 hover:bg-yellow-500/30 rounded border border-yellow-500/30 transition" title="Add/Remove Sparks">
                        <i class="fa-solid fa-coins"></i>
                    </button>
                    <button onclick="sendAction({action:'toggle_cosmetics', hwid:'${key}'})" class="px-3 py-1 bg-accent/20 text-accent hover:bg-accent/30 rounded border border-accent/30 transition" title="Toggle Standard Cosmetics">
                        <i class="fa-solid fa-shirt"></i>
                    </button>
                    <button onclick="if(confirm('Move user to recycle bin?')) sendAction({action:'soft_delete', hwid:'${key}'})" class="px-3 py-1 bg-red-500/20 text-red-400 hover:bg-red-500/30 rounded border border-red-500/30 transition" title="Delete User">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                `);

                let onlineBadge = '<span class="w-3 h-3 rounded-full bg-gray-500 inline-block mr-2" title="Вне сети"></span>';
                if (gameOnline) {
                    onlineBadge = '<span class="w-3 h-3 rounded-full bg-green-500 inline-block mr-2 shadow-[0_0_8px_rgba(34,197,94,0.8)]" title="В игре"></span>';
                } else if (webOnline || (user.lastPing && (Date.now() - user.lastPing) < 5 * 60 * 1000)) {
                    onlineBadge = '<span class="w-3 h-3 rounded-full bg-blue-500 inline-block mr-2 shadow-[0_0_8px_rgba(59,130,246,0.8)]" title="На сайте"></span>';
                }

                let playtimeStr = user.playtime ? (user.playtime / 3600).toFixed(1) + 'ч' : '';
                let playtimeBadge = playtimeStr ? `<span class="ml-2 text-xs text-gray-500 font-normal">⏱ ${playtimeStr}</span>` : '';

                tr.innerHTML = `
                    <td class="p-4">
                        ${isEditorMode ? `<input type="checkbox" class="user-cb" value="${key}" onclick="updateSelection()">` : ''}
                    </td>
                    <td class="p-4 font-medium"><div class="flex items-center">${onlineBadge}${user.username || 'Unknown'}${playtimeBadge}</div></td>
                    <td class="p-4">
                        <span class="text-yellow-400 font-bold"><i class="fa-solid fa-bolt mr-1"></i>${user.coins || 0}</span>
                    </td>
                    <td class="p-4 text-right space-x-2 whitespace-nowrap">
                        <button onclick="toggleCosmetics('${key}')" class="px-3 py-1 bg-dark text-gray-300 hover:bg-gray-800 rounded border border-gray-700 transition" title="Показать косметику">
                            Косметика <i class="fa-solid fa-chevron-down text-xs ml-1"></i>
                        </button>
                        ${singleActions}
                    </td>
                `;
                
                const trCosmetics = document.createElement('tr');
                trCosmetics.id = `cosmetics-${key}`;
                trCosmetics.className = "hidden bg-dark/40 border-b border-gray-800/50";
                trCosmetics.innerHTML = `
                    <td colspan="4" class="p-4 px-8 border-l-2 border-primary/50">
                        <div class="text-sm text-gray-400 mb-2">Наличие косметики:</div>
                        <div class="flex flex-wrap gap-2">${cosmeticsHtml}</div>
                    </td>
                `;

                tbody.appendChild(tr);
                tbody.appendChild(trCosmetics);
            }
            document.getElementById('stat-total').textContent = total;
            document.getElementById('stat-game').textContent = gameOnlineCount;
            document.getElementById('stat-web').textContent = webOnlineCount;
        }

        function toggleCosmetics(key) {
            const el = document.getElementById('cosmetics-' + key);
            if(el.classList.contains('hidden')) {
                el.classList.remove('hidden');
            } else {
                el.classList.add('hidden');
            }
        }

        function createUser() {
            const username = document.getElementById('newUsername').value || 'NewUser';
            sendAction({ action: 'create', username });
            document.getElementById('newUsername').value = '';
        }

        
        function sendWebPing() {
            if (getAuthToken()) {
                fetch('/api/web-ping', { method: 'POST', headers: {'X-Admin-Token': getAuthToken()} }).catch(()=>{});
            }
        }
        setInterval(sendWebPing, 60000);
        setInterval(fetchUsers, 30000); // auto update table
    
        window.onload = () => { checkAuth(); sendWebPing(); };
    </script>
</body>
</html>
